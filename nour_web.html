<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="author" content="FoxSD" />
<title>Nour-AI — FoxSD</title>
<style>
  :root{
    --bg:#060910; --panel:#0e1420; --panel2:#131b2a; --line:rgba(255,255,255,.09);
    --txt:#e9eff8; --mut:#8ea0b8; --acc:#22d3a6; --acc2:#3b82f6; --me:#1c2536;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI",Tahoma,system-ui,sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(34,211,166,.07),transparent)}
  .logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;
    background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04121a;font-size:19px}
  .titles h1{margin:0;font-size:19px;letter-spacing:.2px}
  .titles p{margin:2px 0 0;font-size:12.5px;color:var(--mut)}
  .status{margin-inline-start:auto;font-size:12.5px;color:var(--acc);display:flex;align-items:center;gap:7px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
  main{flex:1;overflow-y:auto;padding:26px 18px 10px}
  .thread{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  .msg{max-width:88%;padding:14px 17px;border-radius:16px;line-height:1.85;font-size:15.3px;
    white-space:pre-wrap;word-wrap:break-word;border:1px solid var(--line)}
  .msg.user{align-self:flex-start;background:var(--me);border-start-start-radius:5px}
  .msg.bot{align-self:flex-end;background:var(--panel);border-start-end-radius:5px}
  .msg.bot b{color:var(--acc)}
  .who{font-size:11.5px;color:var(--mut);margin-bottom:6px;display:block}
  .log{align-self:flex-end;max-width:88%;font-family:ui-monospace,Consolas,monospace;font-size:12.6px;
    color:#9fe8d3;background:rgba(34,211,166,.06);border:1px solid rgba(34,211,166,.22);
    border-radius:10px;padding:9px 13px;white-space:pre-wrap;direction:ltr;text-align:left}
  .files{align-self:flex-end;max-width:88%;background:var(--panel2);border:1px solid var(--line);
    border-radius:14px;padding:14px 16px}
  .files h4{margin:0 0 10px;font-size:13.5px;color:var(--acc)}
  .files button{display:block;width:100%;text-align:start;background:none;border:none;color:var(--txt);
    font:inherit;font-size:13px;padding:6px 4px;cursor:pointer;border-radius:8px}
  .files button:hover{background:rgba(255,255,255,.05);color:var(--acc)}
  .hint{align-self:flex-end;color:var(--mut);font-size:12.5px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;max-width:820px;margin:0 auto}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:999px;
    padding:8px 15px;font:inherit;font-size:13px;cursor:pointer;transition:.2s}
  .chip:hover{border-color:var(--acc);color:var(--acc)}
  footer{border-top:1px solid var(--line);padding:14px 18px 18px;background:var(--bg)}
  form{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;resize:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    color:var(--txt);font:inherit;font-size:15px;padding:14px 16px;max-height:150px;min-height:52px;outline:none}
  textarea:focus{border-color:var(--acc)}
  button.send{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;color:#04121a;
    font-weight:700;font-size:15px;padding:0 22px;height:52px;border-radius:14px;cursor:pointer}
  button.send:disabled{opacity:.45;cursor:not-allowed}
  .credit{max-width:820px;margin:10px auto 0;font-size:11.5px;color:var(--mut);text-align:center}
  .cursor{display:inline-block;width:8px;height:16px;background:var(--acc);vertical-align:-3px;
    animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<header>
  <div class="logo">N</div>
  <div class="titles">
    <h1>Nour-AI</h1>
    <p>وكيل ذكاء اصطناعي تجاري — FoxSD</p>
  </div>
  <div class="status"><span class="dot"></span><span id="status">جاهز</span></div>
</header>

<main id="main">
  <div class="thread" id="thread"></div>
  <div style="max-width:820px;margin:20px auto 0" id="chips" class="chips"></div>
</main>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="اكتب طلبك… مثال: ابنِ لي موقعًا لمتجر إلكتروني"></textarea>
    <button class="send" id="send" type="submit">إرسال</button>
  </form>
  <div class="credit">© FoxSD — foxsd520@gmail.com</div>
</footer>

<script>
const thread = document.getElementById('thread');
const input  = document.getElementById('input');
const form   = document.getElementById('form');
const send   = document.getElementById('send');
const statusEl = document.getElementById('status');
const main   = document.getElementById('main');
const chips  = document.getElementById('chips');

const SESSION = (() => {
  let s = localStorage.getItem('nour_session');
  if (!s) { s = 'fox-' + Math.random().toString(36).slice(2, 10); localStorage.setItem('nour_session', s); }
  return s;
})();

const SUGGESTIONS = [
  'ابنِ لي موقعًا تعريفيًا لشركة FoxSD',
  'ابنِ لي نظام إدارة مهام بالعربية',
  'ابنِ لي آلة حاسبة كتطبيق ويب',
  'ابنِ لي سكربت بايثون لتنظيم الملفات',
];

function scroll() { main.scrollTop = main.scrollHeight; }

function bubble(kind, html) {
  const d = document.createElement('div');
  d.className = 'msg ' + kind;
  d.innerHTML = html;
  thread.appendChild(d);
  scroll();
  return d;
}

function logLine(text) {
  const d = document.createElement('div');
  d.className = 'log';
  d.textContent = text;
  thread.appendChild(d);
  scroll();
  return d;
}

function filesCard(project, files) {
  const d = document.createElement('div');
  d.className = 'files';
  const h = document.createElement('h4');
  h.textContent = '📦 ملفات مشروع «' + project + '» (' + files.length + ')';
  d.appendChild(h);
  files.forEach(f => {
    const b = document.createElement('button');
    b.textContent = '› ' + f;
    b.onclick = () => openFile(project, f);
    d.appendChild(b);
  });
  thread.appendChild(d);
  scroll();
}

async function openFile(project, path) {
  const r = await fetch('/api/projects/' + encodeURIComponent(project) + '/file?path=' + encodeURIComponent(path));
  const j = await r.json();
  const d = document.createElement('div');
  d.className = 'log';
  d.textContent = '— ' + path + ' —\n' + (j.content || j.detail || '');
  thread.appendChild(d);
  scroll();
}

function renderSuggestions() {
  chips.innerHTML = '';
  SUGGESTIONS.forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = s;
    b.onclick = () => { input.value = s; chips.innerHTML = ''; form.requestSubmit(); };
    chips.appendChild(b);
  });
}

async function sendMessage(text) {
  chips.innerHTML = '';
  bubble('user', '<span class="who">أنت</span>' + text.replace(/</g, '&lt;'));
  input.value = ''; input.style.height = 'auto';
  send.disabled = true; statusEl.textContent = 'يفكّر…';

  const bot = bubble('bot', '<span class="who">Nour-AI</span><span class="cursor"></span>');
  const body = bot.querySelector('.cursor');

  let acc = '';
  let built = false;

  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: SESSION, message: text}),
  });

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const {value, done} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    const parts = buf.split('\n\n');
    buf = parts.pop();
    for (const p of parts) {
      const line = p.replace(/^data: /, '').trim();
      if (!line) continue;
      let ev; try { ev = JSON.parse(line); } catch { continue; }
      if (ev.type === 'token') {
        acc += ev.text;
        bot.innerHTML = '<span class="who">Nour-AI</span>' + acc.replace(/</g, '&lt;');
        scroll();
      } else if (ev.type === 'build_start') {
        bot.innerHTML = '<span class="who">Nour-AI</span>' + (acc || 'سأبني ذلك الآن…');
        logLine('▶ بدء البناء — FoxSD');
        statusEl.textContent = 'يبني…';
      } else if (ev.type === 'log') {
        logLine(ev.text);
      } else if (ev.type === 'done') {
        built = !!ev.project;
        if (ev.text) {
          bot.innerHTML = '<span class="who">Nour-AI</span>' + ev.text.replace(/</g, '&lt;');
        } else if (!acc) {
          bot.innerHTML = '<span class="who">Nour-AI</span>تم ✅';
        }
        if (built && ev.files) filesCard(ev.project, ev.files);
      } else if (ev.type === 'error') {
        bot.innerHTML = '<span class="who">Nour-AI</span>⚠️ ' + ev.text;
      }
      scroll();
    }
  }
  send.disabled = false; statusEl.textContent = 'جاهز';
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const t = input.value.trim();
  if (t) sendMessage(t);
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';
});

(async () => {
  try {
    const h = await (await fetch('/api/history?session_id=' + SESSION)).json();
    if (!h.messages || !h.messages.length) {
      bubble('bot', '<span class="who">Nour-AI</span>مرحبًا 👋 أنا <b>Nour-AI</b> من <b>FoxSD</b>.<br>اكتب طلبك وسأبنيه لك فعليًا — موقعًا، برنامجًا، أو نظامًا كاملًا.');
      renderSuggestions();
    } else {
      h.messages.forEach(m => bubble(m.role === 'user' ? 'user' : 'bot',
        '<span class="who">' + (m.role === 'user' ? 'أنت' : 'Nour-AI') + '</span>' + String(m.content).replace(/</g, '&lt;')));
    }
  } catch { renderSuggestions(); }
})();
</script>
</body>
</html>
